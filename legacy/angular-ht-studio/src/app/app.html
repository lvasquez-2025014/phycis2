<div class="app-layout">
  <!-- ENCABEZADO SUPERIOR -->
  <app-header (generatePdf)="onGeneratePdf()"></app-header>

  <!-- CONTROLES FLOTANTES DE VISTA (PANTALLA COMPLETA O SPLIT) -->
  <div class="view-controls no-print">
    <div class="view-mode-pills">
      <button
        type="button"
        class="pill-btn"
        [class.active]="viewMode() === 'split'"
        (click)="setViewMode('split')"
        title="Vista dividida: Editor y Hoja en vivo"
      >
        <svg
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="9" y1="3" x2="9" y2="21"></line>
        </svg>
        Editor y Vista Previa
      </button>

      <button
        type="button"
        class="pill-btn"
        [class.active]="viewMode() === 'preview_only'"
        (click)="setViewMode('preview_only')"
        title="Ver solo la hoja de trabajo"
      >
        <svg
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
        Solo Hoja (Vista Completa)
      </button>

      <button
        type="button"
        class="pill-btn"
        [class.active]="viewMode() === 'editor_only'"
        (click)="setViewMode('editor_only')"
        title="Ver solo el editor"
      >
        <svg
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="M12 20h9"></path>
          <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
        </svg>
        Solo Editor
      </button>
    </div>
  </div>

  <!-- ÁREA PRINCIPAL -->
  <main class="app-main">
    <!-- PANEL EDITOR (IZQUIERDA) -->
    @if (viewMode() === 'split' || viewMode() === 'editor_only') {
    <app-editor [class.expanded]="viewMode() === 'editor_only'"></app-editor>
    }

    <!-- PANEL VISTA PREVIA HOJA DE TRABAJO (DERECHA) -->
    @if (viewMode() === 'split' || viewMode() === 'preview_only') {
    <div class="preview-wrapper" [class.full-width]="viewMode() === 'preview_only'">
      <app-worksheet-preview></app-worksheet-preview>
    </div>
    }
  </main>

  <!-- OVERLAY DE GENERACIÓN DE PDF -->
  @if (pdfService.isGenerating()) {
  <div class="pdf-overlay no-print">
    <div class="pdf-modal">
      <div class="loader-ring"></div>
      <h3>Generando tu Hoja de Trabajo en PDF</h3>
      <p>{{ pdfService.progressMessage() }}</p>
      <span class="sub-hint">Preparando maquetación y resoluciones...</span>
    </div>
  </div>
  }
</div>
